/* ===== arrastrar y soltar (pointer events: funciona con dedo y mouse) ===== */
function makeDrag(node,opts){
  opts=opts||{};node.classList.add('draggable');
  let sx,sy,bx,by,moved,cap=null;
  const parentRect=()=>{const p=node.offsetParent;return p?p.getBoundingClientRect():{left:0,top:0};};
  const bounds=()=>opts.area?opts.area.getBoundingClientRect():{left:0,top:0,width:window.innerWidth,height:window.innerHeight};
  node.addEventListener('pointerdown',e=>{
    e.preventDefault();cap=e.pointerId;moved=0;try{node.setPointerCapture(cap);}catch(_){}
    const r=node.getBoundingClientRect(),pr=parentRect();
    bx=r.left-pr.left;by=r.top-pr.top;sx=e.clientX;sy=e.clientY;
    node.style.left=bx+'px';node.style.top=by+'px';node.style.right='auto';node.style.margin='0';
    node.classList.add('dragging');
  });
  node.addEventListener('pointermove',e=>{
    if(cap==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;moved=Math.max(moved,Math.abs(dx)+Math.abs(dy));
    const b=bounds(),pr=parentRect(),minX=b.left-pr.left,minY=b.top-pr.top;
    let nx=Math.max(minX,Math.min(minX+b.width-node.offsetWidth,bx+dx));
    let ny=Math.max(minY,Math.min(minY+b.height-node.offsetHeight,by+dy));
    node.style.left=nx+'px';node.style.top=ny+'px';if(opts.onMove)opts.onMove(e);
  });
  const end=e=>{if(cap==null)return;try{node.releasePointerCapture(cap);}catch(_){}cap=null;node.classList.remove('dragging');if(opts.onEnd)opts.onEnd(e,moved);};
  node.addEventListener('pointerup',end);node.addEventListener('pointercancel',end);
}

function m_cuentos(){S.data.escenarios=[];esc(0);}
function esc(i){
  const list=S.band.esc,sc=list[i],q=sc.t,acc=S.band.acc;
  app.innerHTML=`<div class="screen">${head('Situaciones')}${dots(i,list.length)}
    <div class="card">${P(q)}
      <p style="font-weight:700;color:var(--navy);margin-top:12px">¿Cómo te sentirías?</p>
      <div class="faces" id="face">${[0,1,2,3].map(v=>`<div class="face" data-v="${v}">${faceSVG([0,1,3,4][v],44)}<small>${['Bien','Tranquilo','Nervioso','Muy mal'][v]}</small></div>`).join('')}</div>
      <p style="font-weight:700;color:var(--navy);margin-top:12px">¿Qué harías?</p>
      <div class="grid" id="acc">${acc.map(a=>`<div class="opt" data-id="${a.id}"><span class="chip" style="background:${a.c}"></span>${a.t}</div>`).join('')}</div></div>
    <div class="foot"><button class="btn btn-primary" id="nx" disabled>Siguiente</button></div></div>`;
  let face=null,ac=null;const chk=()=>{if(face!==null&&ac!==null)document.getElementById('nx').disabled=false;};
  document.querySelectorAll('#face .face').forEach(f=>f.onclick=()=>{document.querySelectorAll('#face .face').forEach(x=>x.classList.remove('sel'));f.classList.add('sel');face=+f.dataset.v;save();chk();});
  document.querySelectorAll('#acc .opt').forEach(o=>o.onclick=()=>{document.querySelectorAll('#acc .opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');ac=o.dataset.id;speak(acc.find(a=>a.id===ac).t);save();chk();});
  document.getElementById('nx').onclick=()=>{i<list.length-1?esc(i+1):finish('cuentos');};
  function save(){const rec={id:sc.id,face,accion:ac};const ex=S.data.escenarios.findIndex(e=>e.id===sc.id);ex>=0?S.data.escenarios[ex]=rec:S.data.escenarios.push(rec);}
  autoRead(q);
}

/* ===== ATENCIÓN ===== */
let atmr=[];
function m_atencion(){
  const teen=S.edad>=12,q=teen?"Toca los verdes lo más rápido posible. No toques los rojos.":"Atrapa las estrellas. ¡No toques las nubes!";
  app.innerHTML=`<div class="screen">${head(teen?'Reflejos':'Atrapa')}
    <div class="card">${P(q)}<div class="gamehud"><span>Aciertos <b id="hit">0</b></span><span>⏱ <b id="clock">30</b>s</span></div><div id="playArea"></div></div>
    <div class="foot"><button class="btn btn-ghost" id="start" onclick="atStart()">Empezar</button><button class="btn btn-primary hidden" id="nx" onclick="finish('atencion')">Listo</button></div></div>`;
  autoRead(q);
}
function atStart(){
  const teen=S.edad>=12;document.getElementById('start').classList.add('hidden');
  const area=document.getElementById('playArea');const g={hit:0,miss:0,err:0,targets:0,rts:[]};S.data.atencion=g;
  let time=30;const clock=document.getElementById('clock');
  const tick=setInterval(()=>{time--;clock.textContent=time;if(time<=0)end();},1000);
  const spawn=setInterval(()=>{const good=Math.random()<0.72;if(good)g.targets++;const born=Date.now();
    const inner=teen?dotSVG(52,good?'#4bbf73':'#e0574f'):(good?starSVG(52):cloudSVG(52));
    const t=el(`<div class="target">${inner}</div>`);t.style.left=Math.random()*(area.clientWidth-60)+'px';t.style.top=Math.random()*(area.clientHeight-60)+'px';
    let alive=true;t.onclick=()=>{if(!alive)return;alive=false;if(good){g.hit++;g.rts.push(Date.now()-born);document.getElementById('hit').textContent=g.hit;}else{g.err++;}t.style.opacity=.3;setTimeout(()=>t.remove(),140);};
    area.appendChild(t);atmr.push(setTimeout(()=>{if(alive){alive=false;if(good)g.miss++;t.remove();}},teen?1000:1200));
  },teen?720:820);
  atmr.push(tick,spawn);
  function end(){atmr.forEach(clearInterval);atmr.forEach(clearTimeout);atmr=[];g.rt_prom=Math.round(avg(g.rts));
    area.innerHTML='<div style="display:flex;height:100%;align-items:center;justify-content:center;font-size:1.1rem;font-weight:800;color:var(--navy)">¡Bien hecho!</div>';document.getElementById('nx').classList.remove('hidden');}
}

function m_globos(){S.data.worries=[];glo_pick();}
function glo_pick(){
  const q="¿Qué cosas te preocupan a veces? Toca los globos.";
  app.innerHTML=`<div class="screen">${head('Globos de la calma')}
    <div class="card">${P(q)}<div class="grid grid-2" id="b" style="margin-top:6px">${WORRIES.map(w=>`<div class="balloon" style="background:${w.c}" data-id="${w.id}">${w.t}</div>`).join('')}</div></div>
    <div class="foot"><button class="btn btn-primary" onclick="glo_pop()">Siguiente</button></div></div>`;
  document.querySelectorAll('#b .balloon').forEach(o=>o.onclick=()=>{o.classList.toggle('sel');S.data.worries=[...document.querySelectorAll('#b .balloon.sel')].map(x=>x.dataset.id);speak(WORRIES.find(w=>w.id===o.dataset.id).t);});
  autoRead(q);
}
function glo_pop(){
  const sel=S.data.worries.length?S.data.worries:WORRIES.slice(0,3).map(w=>w.id);const q="Arrastra cada preocupación a la caja de la calma.";
  app.innerHTML=`<div class="screen">${head('Globos de la calma')}
    <div class="card">${P(q)}<div id="pa" style="position:relative;height:340px">${sel.map((id,k)=>{const w=WORRIES.find(x=>x.id===id);return `<div class="balloon draggable" style="position:absolute;width:40%;background:${w.c};left:${4+(k%2)*52}%;top:${3+Math.floor(k/2)*27}%" data-id="${id}">${w.t}</div>`;}).join('')}
      <div class="calmbox" id="calm">🌿 Caja de la calma<small style="font-weight:600;display:block;opacity:.85">suéltalas aquí</small></div>
      <div id="allpop" class="center hidden" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--green);font-size:1.2rem;background:rgba(255,255,255,.85);border-radius:16px">¡Muy bien! 🎉</div></div>
      <p class="muted" style="font-size:.76rem;text-align:center;margin-top:6px">Tip: también puedes tocar un globo para soltarlo.</p></div>
    <div class="foot"><button class="btn btn-primary" onclick="glo_breathe()">Siguiente</button></div></div>`;
  const area=document.getElementById('pa'),calm=document.getElementById('calm');let left=sel.length;
  const absorb=b=>{if(!b||b.__gone)return;b.__gone=true;calm.classList.remove('hot');b.style.animation='absorb .42s ease forwards';speak('Muy bien');
    setTimeout(()=>b.remove(),420);if(--left<=0){document.getElementById('allpop').classList.remove('hidden');speak('¡Muy bien!');}};
  document.querySelectorAll('#pa .balloon').forEach(b=>makeDrag(b,{area,
    onMove:e=>calm.classList.toggle('hot',overZone(e,calm)),
    onEnd:(e,moved)=>{if(overZone(e,calm)||moved<8)absorb(b);else calm.classList.remove('hot');}}));
  autoRead(q);
}
function glo_breathe(){
  const q="Respira conmigo. Inhala… y exhala…";
  app.innerHTML=`<div class="screen">${head('Globos de la calma')}
    <div class="card center">${P(q)}<div class="breathe" id="bc">Inhala</div><p class="muted">Sigue el círculo 3 veces</p></div>
    <div class="foot"><button class="btn btn-primary" onclick="glo_miedo()">Siguiente</button></div></div>`;
  const bc=document.getElementById('bc');let n=0;
  (function cyc(){if(n>=3){bc.textContent='¡Bien!';return;}bc.textContent='Inhala';bc.style.transform='scale(1.5)';speak('Inhala');setTimeout(()=>{bc.textContent='Exhala';bc.style.transform='scale(1)';speak('Exhala');n++;setTimeout(cyc,600);},4000);})();
  autoRead(q);
}
function glo_miedo(){choice('Cuando algo te da miedo, ¿qué haces?','miedo_accion','Globos de la calma',[{id:'adulto',t:'Busco a un adulto',c:'#7c4dbd'},{id:'respiro',t:'Respiro y me calmo',c:'#3f9e5a'},{id:'amigo',t:'Le digo a un amigo',c:'#4a90d9'},{id:'solito',t:'Me quedo callado',c:'#9aa7b6'}],()=>finish('globos'));}

function m_memorama(){
  const q="Encuentra las parejas iguales.",keys=['star','heart','moon','sun','flower','cloud'];
  const cols={star:'#E9B10A',heart:'#e0679a',moon:'#7c4dbd',sun:'#f0883e',flower:'#3f9e5a',cloud:'#4a90d9'};
  let deck=[...keys,...keys].map((k,i)=>({k,i})).sort(()=>Math.random()-0.5);S.data.memorama={moves:0,errores:0,t0:Date.now()};
  app.innerHTML=`<div class="screen">${head('Memorama')}
    <div class="card">${P(q)}<div class="gamehud"><span>Parejas <b id="pairs">0</b>/6</span><span>Intentos <b id="mv">0</b></span></div>
      <div class="mem" id="mem">${deck.map((c,idx)=>`<button class="mcard" data-idx="${idx}" data-k="${c.k}"></button>`).join('')}</div></div>
    <div class="foot"><button class="btn btn-primary hidden" id="nx" onclick="finish('memorama')">Listo</button></div></div>`;
  let flip=[],matched=0,lock=false;
  document.querySelectorAll('#mem .mcard').forEach(card=>card.onclick=()=>{
    if(lock||card.classList.contains('flip')||card.classList.contains('matched'))return;
    card.classList.add('flip');card.innerHTML=icon(card.dataset.k,30,cols[card.dataset.k]);flip.push(card);
    if(flip.length===2){lock=true;S.data.memorama.moves++;document.getElementById('mv').textContent=S.data.memorama.moves;const[a,b]=flip;
      if(a.dataset.k===b.dataset.k){setTimeout(()=>{a.classList.add('matched');b.classList.add('matched');a.classList.remove('flip');b.classList.remove('flip');matched++;document.getElementById('pairs').textContent=matched;flip=[];lock=false;if(matched===6){S.data.memorama.dur=Math.round((Date.now()-S.data.memorama.t0)/1000);document.getElementById('nx').classList.remove('hidden');}},420);}
      else{S.data.memorama.errores++;setTimeout(()=>{a.classList.remove('flip');b.classList.remove('flip');a.innerHTML='';b.innerHTML='';flip=[];lock=false;},720);}}
  });autoRead(q);
}

/* ===== CIERRE · REGISTRO OBSERVACIONAL (facilitador, 0-3) ===== */
const OBSITEMS=[
 {k:'ini_contacto',t:'Le costó iniciar contacto con otros',tag:'social'},
 {k:'no_invita',t:'No respondió a las invitaciones a jugar',tag:'social'},
 {k:'poca_verbal',t:'Poca o nula participación verbal',tag:'social'},
 {k:'evita_expo',t:'Malestar o evitación ante la exposición',tag:'social'},
 {k:'periferia',t:'Se mantuvo en la periferia (no en el centro)',tag:'social'},
 {k:'somaticas',t:'Señales somáticas visibles (rubor, temblor)',tag:'social'},
 {k:'recurre_adulto',t:'Recurrió al adulto para sentirse seguro',tag:'dependencia'}
];
function cierre(){
  S.data.obs_ratings={};
  app.innerHTML=`<div class="screen"><div class="topbar"><button class="back" onclick="menu()">‹ Menú</button><span class="badge">Registro observacional</span></div>
    <div class="card"><h2>Cierre del observador</h2><p class="muted">Registro del facilitador (0 = nada, 3 = mucho) sobre la conducta real en <b>${S.actividad}</b> · corte ${S.corte}.</p>
      ${OBSITEMS.map(it=>`<div style="margin:12px 0"><div style="font-weight:700;color:var(--navy);font-size:.9rem">${it.t}</div><div class="rate" data-k="${it.k}">${[0,1,2,3].map(v=>`<button data-v="${v}">${v}</button>`).join('')}</div></div>`).join('')}

/* ===== SCORING ===== */
function escAvg(tag){const it=(S.band.escala||[]).filter(x=>x.tag===tag);if(!it.length||!S.data.escala)return null;const v=it.map(x=>S.data.escala[x.id]).filter(x=>x!=null);return v.length?avg(v)/3*100:null;}
function obsAvg(tag){const it=OBSITEMS.filter(x=>x.tag===tag);const o=S.data.obs_ratings||{};const v=it.map(x=>o[x.k]).filter(x=>x!=null);return v.length?avg(v)/3*100:null;}
function score(){
  const d=S.data,esc=d.escenarios||[],byId=id=>esc.find(e=>e.id===id);
  const accPen={acerco:0,miro:50,adulto:40,escondo:100},accDep={adulto:100,escondo:70,miro:40,acerco:10};
  const wtag=t=>(d.worries||[]).map(id=>WORRIES.find(w=>w.id===id)).filter(w=>w&&w.tag===t).length;
  const W=p=>p.length?clamp(p.reduce((s,x)=>s+x.v*x.w,0)/p.reduce((s,x)=>s+x.w,0)):null;
  // ANSIEDAD SOCIAL (foco)
  let sp=[];{const e=escAvg('social');if(e!=null)sp.push({v:e,w:.5});}
  {const o=obsAvg('social');if(o!=null)sp.push({v:o,w:.4});}
  if(esc.length){const soc=['frente','invitan','rian','alberca'].map(id=>{const e=byId(id);if(!e)return null;let a=accPen[e.accion]??0;if(id==='invitan'&&e.accion==='acerco')a=0;return .6*(e.face/3*100)+.4*a;}).filter(x=>x!=null);if(soc.length)sp.push({v:avg(soc),w:.35});}
  if(wtag('social'))sp.push({v:clamp(wtag('social')*33),w:.15});
  if(d.sociograma)sp.push({v:d.sociograma==='solo'?80:d.sociograma==='nose'?60:d.sociograma==='unodos'?30:10,w:.15});
  const asoc=W(sp);
  // ANSIEDAD GENERAL (paraguas)
  let gp=[];if(d.termo_inicio!=null)gp.push({v:d.termo_inicio/4*100,w:.45});if(esc.length)gp.push({v:avg(esc.map(e=>e.face/3*100)),w:.35});if(d.worries)gp.push({v:clamp(d.worries.length/4*100),w:.2});
  const ag=W(gp);
  // INATENCIÓN
  let ip=[];if(d.atencion&&d.atencion.targets){const om=d.atencion.miss/d.atencion.targets,er=d.atencion.err/((d.atencion.hit+d.atencion.err)||1);ip.push({v:clamp(.65*om*100+.35*er*100),w:.6});}
  if(d.memorama&&d.memorama.moves)ip.push({v:clamp(d.memorama.errores/d.memorama.moves*100),w:.4});
  const inat=W(ip);
  // DEPENDENCIA / SEPARACIÓN
  let dp=[];const sep=byId('despedida');if(sep)dp.push({v:.4*(sep.face/3*100)+.6*(accDep[sep.accion]??10),w:.3});
  {const o=obsAvg('dependencia');if(o!=null)dp.push({v:o,w:.3});}
  if(d.miedo_accion)dp.push({v:d.miedo_accion==='adulto'?100:(d.miedo_accion==='solito'?30:0),w:.15});
  if(d.apoyo_quien)dp.push({v:d.apoyo_quien==='familia'||d.apoyo_quien==='adulto'?80:(d.apoyo_quien==='nadie'?20:40),w:.12});
  if(wtag('separacion'))dp.push({v:clamp(wtag('separacion')*50),w:.15});
  const dep=W(dp);
  // RED DE APOYO (protector)
  let rp=[];const am={si:100,uno:70,no:0},cm={si:100,aveces:50,no:0},mm={respiro:100,amigo:80,adulto:50,solito:10};
  if(d.amigo!=null)rp.push({v:am[d.amigo]??0,w:.28});if(d.calma_solo!=null)rp.push({v:cm[d.calma_solo]??0,w:.22});
  if(d.miedo_accion)rp.push({v:mm[d.miedo_accion]??0,w:.18});
  if(d.sociograma)rp.push({v:d.sociograma==='varios'?100:d.sociograma==='unodos'?70:d.sociograma==='nose'?30:20,w:.18});
  if(d.autoconcepto)rp.push({v:{si:100,aveces:55,no:15}[d.autoconcepto],w:.18});
  if(esc.length)rp.push({v:['frente','invitan','alberca'].filter(id=>{const e=byId(id);return e&&e.accion==='acerco';}).length/3*100,w:.14});
  const apoyo=W(rp);
  const nivel=asoc==null?'sin dato':asoc<25?'mínimo':asoc<45?'leve':asoc<65?'moderado':'marcado';
  const R=v=>v==null?null:Math.round(v);
  return {ansiedad_general:R(ag),ansiedad_social:R(asoc),inatencion:R(inat),dependencia:R(dep),red_apoyo:R(apoyo),nivel_global:nivel};
}

/* ===== RESULTADOS ===== */
function colorFor(v,p){if(v==null)return '#9aa7b6';const bad=p?100-v:v;return bad<25?'#3f9e5a':bad<45?'#9bbf3f':bad<65?'#E9B10A':'#d9534f';}
function resultados(){
  const r=score();S.scores=r;S.dur=Math.round((Date.now()-S.t0)/1000);
  const M=[['ansiedad_social','Ansiedad social',false,true],['ansiedad_general','Ansiedad general',false,false],['dependencia','Dependencia / separación',false,false],['inatencion','Inatención',false,false],['red_apoyo','Red de apoyo (protector)',true,false]];
  app.innerHTML=`<div class="screen"><div class="topbar"><span class="brand">Resultados</span><span class="badge">${S.nino.codigo} · ${S.band.label} · ${S.corte}</span></div>
    <div class="card"><div style="font-weight:800;font-size:1.1rem">Ansiedad social: <span style="text-transform:capitalize">${r.nivel_global}</span></div>
      <div class="muted" style="font-size:.85rem;margin-bottom:6px">${S.actividad} · edad ${S.edad} · Sem ${S.semana} · índices 0–100. No es diagnóstico.</div>
      ${M.map(([k,t,p,foco])=>{const v=r[k];const c=colorFor(v,p);return `<div class="metric ${foco?'':''}"><div class="mh"><span>${foco?'★ ':''}${t}</span><span style="color:${c}">${v==null?'—':v}${p&&v!=null?' ▲':''}</span></div><div class="bar"><i style="width:${v==null?0:v}%;background:${c}"></i></div></div>`;}).join('')}</div>
    <div class="card"><button class="btn btn-primary btn-lg" id="save" onclick="guardar()">Guardar en la base</button>
      <div class="row" style="margin-top:10px"><button class="btn btn-ghost" onclick="descargar()">Respaldo</button><button class="btn btn-ghost" onclick="copiarFila()">Fila Excel</button></div>
      <button class="link" style="margin:12px auto 0;display:block" onclick="entrar2()">Otra sesión (mismo participante)</button>
      <p class="ethics">Foco: <b>ansiedad social</b> (subescala tipo SCAS + caras + registro observacional). Interpretación por grupo de edad; la valida un profesional. <b>No es diagnóstico.</b></p></div></div>`;
}
function entrar2(){S={...S,t0:Date.now(),done:{},data:{escenarios:[]},scores:null};menu();}

/* ===== SAVE + COLA OFFLINE =====
   - Cada sesión lleva un UUID generado en el cliente => reintentos idempotentes
     (un 409 significa "ya guardada", nunca se duplica).
   - Si no hay conexión, la sesión queda en una cola local (localStorage) y se
     sincroniza sola al recuperar internet. La cola se vacía al sincronizar;
     no es un almacén permanente de datos sensibles. */
const genId=()=> (crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16);}));
const COLA_KEY='obs_cola_v1';
const colaGet=()=>{try{return JSON.parse(localStorage.getItem(COLA_KEY)||'[]');}catch(e){return[];}};
const colaSet=a=>{try{localStorage.setItem(COLA_KEY,JSON.stringify(a));}catch(e){}};
async function enviar(p){
  const clave=(localStorage.getItem('obs_clave_app')||'').trim();
  const res=await fetch(CONFIG.CAP_FN,{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({clave,sesion:p})});
  if(res.status===409)return 'dup';      // ya existía: éxito idempotente
  if(res.status===401){const e=new Error('clave_invalida');e.claveInvalida=true;throw e;}
  if(!res.ok)throw new Error('HTTP '+res.status);
  return 'ok';
}
async function colaSync(){
  const cola=colaGet();if(!cola.length)return;
  const resto=[];let enviadas=0;
  for(const p of cola){try{await enviar(p);enviadas++;}catch(e){resto.push(p);}}
  colaSet(resto);
  if(enviadas)toast(`Sincronizadas ${enviadas} sesión(es) pendiente(s).`);
}
window.addEventListener('online',colaSync);
setTimeout(colaSync,1500);
function payload(){const r=S.scores||score();return {id:(S.saveId=S.saveId||genId()),nino_codigo:S.nino.codigo,nino_nombre:S.nino.nombre,edad:S.edad,semana:S.semana,observador:S.observador||null,dispositivo:(S.bandKey+' | '+navigator.userAgent).slice(0,90),duracion_seg:S.dur||null,modo:S.corte.toLowerCase(),juegos:S.bandKey+':'+Object.keys(S.done).join(','),ansiedad_general:r.ansiedad_general,ansiedad_social:r.ansiedad_social,inatencion:r.inatencion,dependencia:r.dependencia,red_apoyo:r.red_apoyo,nivel_global:r.nivel_global,respuestas:{banda:S.bandKey,actividad:S.actividad,corte:S.corte,...S.data},notas:(document.querySelector('#notas')?.value)||S.data.notas||null};}
async function guardar(){const btn=document.getElementById('save');btn.disabled=true;btn.textContent='Guardando…';
  const p=payload();
  try{await enviar(p);btn.textContent='Guardado ✓';btn.style.background='var(--green)';toast('Sesión guardada · id '+String(p.id).slice(0,8));colaSync();
  }catch(e){
    if(e.claveInvalida){
      btn.disabled=false;btn.textContent='Reintentar guardar';btn.style.background='var(--red)';
      toast('Clave de aplicación incorrecta. Corrígela en la pantalla inicial (Cambiar de participante).',4200);
      return;
    }
    // sin conexión o error del servidor: a la cola local, se sincroniza sola después
    const cola=colaGet();if(!cola.some(x=>x.id===p.id))cola.push(p);colaSet(cola);
    btn.textContent='Pendiente de sincronizar ⏳';btn.style.background='var(--gold)';btn.disabled=true;
    toast('Sin conexión: la sesión quedó guardada en el teléfono y se enviará sola al volver el internet.',4200);
  }}
function descargar(){const blob=new Blob([JSON.stringify(payload(),null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`obs_${S.nino.codigo}_${S.bandKey}_S${S.semana}.json`;a.click();toast('Respaldo descargado');}
function copiarFila(){const r=S.scores;const row=[S.nino.codigo,S.nino.nombre,S.edad,S.bandKey,S.semana,S.corte,S.actividad,r.ansiedad_social,r.ansiedad_general,r.dependencia,r.inatencion,r.red_apoyo,r.nivel_global].join('\t');navigator.clipboard?.writeText(row).then(()=>toast('Fila copiada'),()=>toast('Copia: '+row));}

inicio();
</script>
